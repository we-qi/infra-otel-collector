receivers:
  # Recebe dados OTLP das aplicações (traces + logs)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Métricas de host: CPU, RAM, disco, rede
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      network: {}
      load: {}
      processes: {}

  # Métricas dos containers Docker
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 60s
    timeout: 20s
    api_version: 1.43

  # Métricas internas do próprio collector
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector-self
          scrape_interval: 60s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  # Adiciona atributos de resource comuns
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:NODE_ENV}
        action: upsert
      - key: host.name
        from_attribute: host.name
        action: insert

  # Batching para eficiência de envio
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Limita uso de memória do collector
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  # Envia tudo para SigNoz Cloud
  otlp/signoz:
    endpoint: ${env:OTLP_ENDPOINT}
    tls:
      insecure: false
    headers:
      signoz-access-token: ${env:OTEL_EXPORTER_OTLP_HEADERS}

  # Log local para debug (desabilitar em prod)
  logging:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/signoz]

    metrics:
      receivers: [otlp, hostmetrics, docker_stats, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/signoz]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/signoz]
