version: '3.7'
services:
  otel-collector:
    image: ghcr.io/we-qi/infra-otel-collector
    container_name: infra-otel-collector
    restart: always
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics do próprio collector
      - "8889:8889"   # Prometheus exporter (scraped externally)
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
